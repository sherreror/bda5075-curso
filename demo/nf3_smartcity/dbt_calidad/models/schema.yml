version: 2

models:
  - name: stg_alertas
    description: "Alertas de calidad del aire de la Smart City (caso demostración)."
    columns:
      - name: id_alerta
        description: "Identificador único de la alerta."
        tests:
          - unique          # Unicidad
          - not_null        # Completitud
      - name: severidad
        description: "Nivel declarado de la alerta."
        tests:
          - not_null        # Completitud
          - accepted_values:  # Validez
              values: ["baja", "media", "alta", "critica"]
      - name: distrito
        description: "Distrito de la alerta. Debe existir en el catálogo oficial."
        tests:
          - relationships:    # Integridad referencial (el anti-join, en YAML)
              to: ref('distritos')
              field: distrito
