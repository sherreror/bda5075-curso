# Stack de observabilidad PRE-PROVISIONADO (el alumno NO configura nada a mano).
#   docker compose up -d   ->  Prometheus :9090  ·  Grafana :3000 (admin/admin)
# El datasource y el dashboard se cargan solos desde grafana/provisioning/.
services:
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alertas.yml:/etc/prometheus/alertas.yml:ro
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
